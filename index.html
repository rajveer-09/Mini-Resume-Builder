<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Smart Resume Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      body {
        font-family: 'Inter', sans-serif;
        /* Immersive Mesh Gradient Background */
        background-color: #4158D0;
        background-image: linear-gradient(43deg, #4158D0 0%, #C850C0 46%, #FFCC70 100%);
        background-attachment: fixed;
        background-size: cover;
        min-height: 100vh;
      }
      
      /* Scrollbar Styling for Glass Panels */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.3);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.5);
      }

      /* Custom Print Styles */
      @media print {
        @page { margin: 0; size: auto; }
        
        html, body {
          background: white !important;
          background-image: none !important;
          height: auto !important;
          overflow: visible !important;
          margin: 0 !important;
          padding: 0 !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        
        #root {
          display: block !important;
          height: auto !important;
          overflow: visible !important;
        }

        /* Hide everything by default */
        .no-print, .no-print * { 
          display: none !important; 
          height: 0 !important;
          width: 0 !important;
          overflow: hidden !important;
        }
        
        /* Ensure the print container is visible and positioned correctly */
        .print-only-container { 
          display: block !important; 
          position: relative !important; /* Changed from absolute to flow naturally */
          width: 100% !important; 
          height: auto !important;
          overflow: visible !important;
          background: white !important;
          z-index: 9999;
        }
      }
      
      /* Hidden on screen */
      .print-only-container { display: none; }
    </style>
